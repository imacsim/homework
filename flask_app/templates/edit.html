{% extends "base.html" %}

{% block content %}
<h2>Редактировать монету</h2>

{% if errors %}
    {% for error in errors %}
        <p>{{ error }}</p>
    {% endfor %}
{% endif %}

<form method="POST">
    <p>Название: <input type="text" name="name" value="{{ name }}"></p>
    <p>Обозначение: <input type="text" name="symbol" value="{{ symbol }}"></p>
    <p>Курс ($): <input type="text" name="price" value="{{ price }}"></p>
    <button type="submit">Сохранить</button>
</form>

<p><a href="{{ url_for('detail', coin_id=coin.id) }}">Отмена</a></p>
{% endblock %}
